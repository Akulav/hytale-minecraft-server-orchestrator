# ---------------------------------------------------------------------------
# Hyve - Build & Release
# ---------------------------------------------------------------------------
# One workflow, two phases:
#
#   * checks  - every push and pull request, on Windows, Linux and macOS:
#               versions agree (Cargo.toml, setup script, Info.plist), clippy
#               without warnings (desktop and headless builds), tests, and the
#               Inno Setup script compiles.
#
#   * release - when a push to `main` carries a version (Cargo.toml) that has
#               no release yet: build the three programs, compute SHA256SUMS,
#               create the tag v<version> and publish the GitHub release. The
#               notes are the version's section of CHANGELOG.md.
#
# Release files: exactly one program per system - the same file installs and
# updates (the in-app updater looks for these names - keep them):
#   Hyve-setup.exe             Windows x64 setup: install and update
#   hyve-linux-x64             Linux x64: desktop (browser app window) and headless in one;
#                              installs itself for the user on first start / --install
#   hyve-macos-arm64           macOS Apple Silicon: builds ~/Applications/Hyve.app on first start
#   SHA256SUMS.txt             checksums of the three
# ---------------------------------------------------------------------------

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # --- Checks (every push + PR, all 3 systems) ------------------------------
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Versions agree
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "Cargo.toml: $v"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::Cargo.toml version is not x.y.z"; exit 1; }
          iss=$(grep -m1 '#define AppVersion "' installer/hyve.iss | cut -d'"' -f2)
          plist=$(grep -A0 -m1 'CFBundleShortVersionString' installer/Info.plist | sed -E 's/.*<string>([^<]+)<\/string>.*/\1/')
          echo "setup: $iss, Info.plist: $plist"
          [ "$iss" = "$v" ] || { echo "::error::installer/hyve.iss says $iss (run scripts/bump-version.ps1)"; exit 1; }
          [ "$plist" = "$v" ] || { echo "::error::installer/Info.plist says $plist (run scripts/bump-version.ps1)"; exit 1; }
          grep -q "^## \[$v\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $v"; exit 1; }

      - name: Clippy (desktop, no warnings)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Clippy (headless, no warnings)
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Setup script compiles (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --locked
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\hyve.iss

  # --- Decide whether to release (push to main, version bumped) --------------
  prepare:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      release: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - name: Check version
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "v$v is already released - skipping"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  # --- Release builds -------------------------------------------------------
  build-windows:
    name: Build Windows x64
    needs: [checks, prepare]
    if: needs.prepare.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Build setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ needs.prepare.outputs.version }} installer\hyve.iss
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item installer\Output\Hyve-setup.exe dist\
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Hyve-setup.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux x64
    needs: [checks, prepare]
    if: needs.prepare.outputs.release == 'true'
    # 22.04: an older glibc, so the program runs on more distributions
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (no GUI libraries linked, runs on desktops and servers)
        run: |
          cargo build --release --locked
          mkdir -p dist
          cp target/release/hyve dist/hyve-linux-x64
          chmod +x dist/*
          # must not need GTK / WebKit
          if ldd dist/hyve-linux-x64 | grep -Ei 'gtk|webkit'; then echo "::error::the Linux program links GTK/WebKit"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  build-mac:
    name: Build macOS arm64
    needs: [checks, prepare]
    if: needs.prepare.outputs.release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked --target aarch64-apple-darwin
      - name: Package (the program; it builds Hyve.app itself on first start)
        run: |
          set -e
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/hyve dist/hyve-macos-arm64
          codesign --force --sign - dist/hyve-macos-arm64
          chmod +x dist/hyve-macos-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  # --- Publish the release (once) -------------------------------------------
  release:
    name: Release v${{ needs.prepare.outputs.version }}
    needs: [prepare, build-windows, build-linux, build-mac]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum Hyve-setup.exe hyve-linux-x64 hyve-macos-arm64 > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes (this version's CHANGELOG section)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, re
          v = re.escape(os.environ["VERSION"])
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[" + v + r"\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          notes = m.group(1).strip() if m else "See CHANGELOG.md"
          open("RELEASE_NOTES.md", "w", encoding="utf-8").write(notes + "\n\nMade by Akulav.\n")
          PY
      - name: Create release + tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: Hyve v${{ needs.prepare.outputs.version }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          files: |
            dist/Hyve-setup.exe
            dist/hyve-linux-x64
            dist/hyve-macos-arm64
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
