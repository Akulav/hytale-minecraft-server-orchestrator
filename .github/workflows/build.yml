# ---------------------------------------------------------------------------
# HyOrchestrator - Build & Release
# ---------------------------------------------------------------------------
# One workflow, two phases:
#
#   * checks  - every push and pull request, on Windows, Linux and macOS:
#               versions agree (Cargo.toml, setup script, Info.plist), clippy
#               without warnings (desktop and headless builds), tests, and the
#               Inno Setup script compiles.
#
#   * release - when a push to `main` carries a version (Cargo.toml) that has
#               no release yet: build the targets, package the Windows setup
#               and the macOS .dmg, compute SHA256SUMS, create the tag
#               v<version> and publish the GitHub release. The notes are the
#               version's section of CHANGELOG.md.
#
# Release files (the in-app updater looks for these names - keep them):
#   HyOrchestrator-setup.exe             Windows x64 setup (also the update)
#   hyorchestrator-linux-x64             Linux x64, desktop window + web UI
#   hyorchestrator-linux-x64-headless    Linux x64, web UI only (no GUI libraries)
#   hyorchestrator-macos-arm64           macOS Apple Silicon program (update)
#   HyOrchestrator-macos-arm64.dmg       macOS app for a first install
#   SHA256SUMS.txt                       checksums of all of the above
# ---------------------------------------------------------------------------

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  LINUX_GUI_DEPS: libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

jobs:
  # --- Checks (every push + PR, all 3 systems) ------------------------------
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_GUI_DEPS

      - name: Versions agree
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "Cargo.toml: $v"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::Cargo.toml version is not x.y.z"; exit 1; }
          iss=$(grep -m1 '#define AppVersion "' installer/hyorchestrator.iss | cut -d'"' -f2)
          plist=$(grep -A0 -m1 'CFBundleShortVersionString' installer/Info.plist | sed -E 's/.*<string>([^<]+)<\/string>.*/\1/')
          echo "setup: $iss, Info.plist: $plist"
          [ "$iss" = "$v" ] || { echo "::error::installer/hyorchestrator.iss says $iss (run scripts/bump-version.ps1)"; exit 1; }
          [ "$plist" = "$v" ] || { echo "::error::installer/Info.plist says $plist (run scripts/bump-version.ps1)"; exit 1; }
          grep -q "^## \[$v\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $v"; exit 1; }

      - name: Clippy (desktop, no warnings)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Clippy (headless, no warnings)
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Setup script compiles (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --locked
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\hyorchestrator.iss

  # --- Decide whether to release (push to main, version bumped) --------------
  prepare:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      release: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - name: Check version
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "v$v is already released - skipping"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  # --- Release builds -------------------------------------------------------
  build-windows:
    name: Build Windows x64
    needs: [checks, prepare]
    if: needs.prepare.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Build setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ needs.prepare.outputs.version }} installer\hyorchestrator.iss
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item installer\Output\HyOrchestrator-setup.exe dist\
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/HyOrchestrator-setup.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux x64
    needs: [checks, prepare]
    if: needs.prepare.outputs.release == 'true'
    # 22.04: an older glibc, so the program runs on more distributions
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux GUI libraries
        run: sudo apt-get update && sudo apt-get install -y $LINUX_GUI_DEPS
      - name: Build (desktop + headless)
        run: |
          cargo build --release --locked --no-default-features
          mkdir -p dist
          cp target/release/hyorchestrator dist/hyorchestrator-linux-x64-headless
          cargo build --release --locked
          cp target/release/hyorchestrator dist/hyorchestrator-linux-x64
          chmod +x dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  build-mac:
    name: Build macOS arm64
    needs: [checks, prepare]
    if: needs.prepare.outputs.release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked --target aarch64-apple-darwin
      - name: Package (.app + .dmg)
        run: |
          set -e
          v=${{ needs.prepare.outputs.version }}
          bin=target/aarch64-apple-darwin/release/hyorchestrator
          mkdir -p dist
          cp "$bin" dist/hyorchestrator-macos-arm64
          app=dmgroot/HyOrchestrator.app
          rm -rf dmgroot && mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "$bin" "$app/Contents/MacOS/hyorchestrator"
          cp installer/Info.plist "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $v" -c "Set :CFBundleVersion $v" "$app/Contents/Info.plist"
          mkdir icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon-1024.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); sips -z $d $d assets/icon-1024.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o "$app/Contents/Resources/icon.icns"
          codesign --force --deep --sign - "$app"
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname HyOrchestrator -srcfolder dmgroot -format UDZO -ov dist/HyOrchestrator-macos-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  # --- Publish the release (once) -------------------------------------------
  release:
    name: Release v${{ needs.prepare.outputs.version }}
    needs: [prepare, build-windows, build-linux, build-mac]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum HyOrchestrator-setup.exe hyorchestrator-linux-x64 hyorchestrator-linux-x64-headless hyorchestrator-macos-arm64 HyOrchestrator-macos-arm64.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes (this version's CHANGELOG section)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, re
          v = re.escape(os.environ["VERSION"])
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[" + v + r"\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          notes = m.group(1).strip() if m else "See CHANGELOG.md"
          open("RELEASE_NOTES.md", "w", encoding="utf-8").write(notes + "\n\nMade by Akulav.\n")
          PY
      - name: Create release + tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: HyOrchestrator v${{ needs.prepare.outputs.version }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          files: |
            dist/HyOrchestrator-setup.exe
            dist/hyorchestrator-linux-x64
            dist/hyorchestrator-linux-x64-headless
            dist/hyorchestrator-macos-arm64
            dist/HyOrchestrator-macos-arm64.dmg
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
